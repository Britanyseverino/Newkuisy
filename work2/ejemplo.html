<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider con Descripción</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

  <div class="slider-container">
    <div class="slider" id="slider">
      
      <div class="slide">
        <img src="IMG1.jpg" alt="Plato 1">
        <div class="desc">Delicioso filete con vegetales frescos</div>
      </div>
      
      <div class="slide">
        <img src="IMG2.jpg" alt="Plato 2">
        <div class="desc">Pasta artesanal con salsa de tomate</div>
      </div>
      
      <div class="slide">
        <img src="IMG3.jpg" alt="Plato 3">
        <div class="desc">Tiramisú cremoso al estilo italiano</div>
      </div>
      
      <div class="slide">
        <img src="img4.jpg" alt="Plato 4">
        <div class="desc">Ensalada fresca con aderezo cítrico</div>
      </div>
      
      <div class="slide">
        <img src="img5.jpg" alt="Plato 5">
        <div class="desc">Salmón a la parrilla con puré de papas</div>
      </div>
      
      <div class="slide">
        <img src="img6.jpg" alt="Plato 6">
        <div class="desc">Postre de chocolate con frutos rojos</div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
